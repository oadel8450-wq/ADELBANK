name: BUILD AGRICULTURAL BANK APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Download Project
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf automake libtool \
            pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake \
            libffi-dev libssl-dev \
            build-essential

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer
          pip install cython==0.29.33

      - name: Check Project Files
        run: |
          echo "Checking project files..."

          if [ ! -f buildozer.spec ]; then
            echo "ERROR: buildozer.spec not found!"
            exit 1
          fi

          if [ -f main.py ]; then
            echo "Found main.py"
          elif [ -f loan.py ]; then
            echo "Found loan.py"
            cp loan.py main.py
          else
            echo "ERROR: Application Python file not found!"
            exit 1
          fi

          ls -la

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p ~/.buildozer
          echo "Android SDK licenses will be accepted during setup."

      - name: Build APK
        env:
          BUILDOZER_WARN_ON_ROOT: "0"
        run: |
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AGRICULTURAL-BANK-ASHMANT-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
